version = 0.1

[default.global.parameters]
stack_name = "genai-inference-model-evaluation-tool"

[default.build.parameters]
cached = true
parallel = true

[ahmed.deploy.parameters]
stack_name = "genai-inference-model-evaluation-tool-ahmed"
