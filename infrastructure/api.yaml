AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API substack — HttpApi and Lambda handlers

Parameters:
  LogRetentionInDays:
    Type: Number
    Default: 14
  Owner:
    Type: String
  Project:
    Type: String
    Default: genai-inference-evaluation-tool
  DatasetBucketName:
    Type: String
  EvaluationJobsTableName:
    Type: String
  AccessCodesTableName:
    Type: String
  EvaluationClusterName:
    Type: String
  EvaluationTaskDefinitionArn:
    Type: String
  PublicSubnetId:
    Type: String
  FargateSecurityGroupId:
    Type: String
  FargateExecutionRoleArn:
    Type: String
  FargateTaskRoleArn:
    Type: String
  SesFromAddress:
    Type: String

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    CodeUri: ../backend/
    Tags:
      Owner: !Ref Owner
      Project: !Ref Project
    Architectures:
      - x86_64
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - '*'
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      AllowHeaders:
        - '*'

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          AccessCodeAuthorizer:
            FunctionArn: !GetAtt AccessCodeAuthorizerFunction.Arn
            Identity:
              Headers:
                - x-access-email
                - x-access-code
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
      Tags:
        Project: !Ref Project
        Owner: !Ref Owner
        Name: !Sub '${AWS::StackName}-api'

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HealthFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationLaunchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationLaunchFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationStatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationStatusFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationResultsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationResultsFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  InitializeDatasetUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${InitializeDatasetUploadFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  ConfirmDatasetUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ConfirmDatasetUploadFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  DocumentConversionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DocumentConversionFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  RunSyntheticPreprocessingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RunSyntheticPreprocessingFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  DocumentConversionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DocumentConversionFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  RequestAccessCodeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RequestAccessCodeFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  VerifyAccessCodeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${VerifyAccessCodeFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  AccessCodeAuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AccessCodeAuthorizerFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: health.handler
      Tags:
        Name: !Sub '${AWS::StackName}-health-function'
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/health.ts

  InitializeDatasetUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: InitializeDatasetUpload.handler
      Tags:
        Name: !Sub '${AWS::StackName}-initialize-dataset-upload-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${DatasetBucketName}/datasets/*'
      Events:
        InitializeDatasetUploadApi:
          Type: HttpApi
          Properties:
            Path: /datasets/init
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/InitializeDatasetUpload/InitializeDatasetUpload.ts

  ConfirmDatasetUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: ConfirmDatasetUpload.handler
      Timeout: 60
      MemorySize: 512
      Tags:
        Name: !Sub '${AWS::StackName}-confirm-dataset-upload-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::${DatasetBucketName}'
              Condition:
                StringLike:
                  s3:prefix:
                    - datasets/*

            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:HeadObject
              Resource:
                - !Sub 'arn:aws:s3:::${DatasetBucketName}/*'
      Events:
        ConfirmDatasetUploadApi:
          Type: HttpApi
          Properties:
            Path: /datasets/{id}/confirm
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/ConfirmDatasetUpload/ConfirmDatasetUpload.ts

  DocumentConversionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: DocumentConversion.handler
      Timeout: 60
      MemorySize: 1024
      Tags:
        Name: !Sub '${AWS::StackName}-document-conversion-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatasetBucketName
        - S3WritePolicy:
            BucketName: !Ref DatasetBucketName
      Events:
        ConvertApi:
          Type: HttpApi
          Properties:
            Path: /documents/convert
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/DocumentConversion/DocumentConversion.ts

  RunSyntheticPreprocessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: RunSyntheticPreprocessing.handler
      Timeout: 60
      MemorySize: 512
      Tags:
        Name: !Sub '${AWS::StackName}-run-synthetic-preprocessing-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
          SYNTHETIC_OUTPUT_MODEL_ID: us.meta.llama4-maverick-17b-instruct-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${DatasetBucketName}/datasets/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        RunSyntheticPreprocessingApi:
          Type: HttpApi
          Properties:
            Path: /preprocessing/{datasetId}/synthetic
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/RunSyntheticPreprocessing/RunSyntheticPreprocessing.ts

  DocumentConversionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: DocumentConversion.handler
      Timeout: 60
      MemorySize: 1024
      Tags:
        Name: !Sub '${AWS::StackName}-document-conversion-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatasetBucketName
        - S3WritePolicy:
            BucketName: !Ref DatasetBucketName
      Events:
        ConvertApi:
          Type: HttpApi
          Properties:
            Path: /documents/convert
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/DocumentConversion/DocumentConversion.ts

  EvaluationLaunchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: EvaluationLaunch.handler
      Timeout: 60
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-launch-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTableName
          ECS_CLUSTER: !Ref EvaluationClusterName
          TASK_DEFINITION: !Ref EvaluationTaskDefinitionArn
          DATASET_BUCKET: !Ref DatasetBucketName
          SUBNET_ID: !Ref PublicSubnetId
          SECURITY_GROUP_ID: !Ref FargateSecurityGroupId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EvaluationJobsTableName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - ecs:RunTask
              Resource: !Ref EvaluationTaskDefinitionArn
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !Ref FargateExecutionRoleArn
                - !Ref FargateTaskRoleArn
      Events:
        LaunchApi:
          Type: HttpApi
          Properties:
            Path: /evaluations
            Method: POST
            ApiId: !Ref Api
            Auth:
              Authorizer: AccessCodeAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationLaunch/EvaluationLaunch.ts

  EvaluationStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: EvaluationStatus.handler
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-status-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationJobsTableName
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            Path: /evaluations/{id}
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationStatus/EvaluationStatus.ts

  EvaluationResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: EvaluationResults.handler
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-results-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationJobsTableName
      Events:
        ResultsApi:
          Type: HttpApi
          Properties:
            Path: /evaluations/{id}/results
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationResults/EvaluationResults.ts

  RequestAccessCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: RequestAccessCode.handler
      Tags:
        Name: !Sub '${AWS::StackName}-request-access-code-function'
      Environment:
        Variables:
          ACCESS_CODES_TABLE: !Ref AccessCodesTableName
          CODE_TTL_MINUTES: '30'
          RESEND_COOLDOWN_SECONDS: '60'
          SES_FROM_ADDRESS: !Ref SesFromAddress
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessCodesTableName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        RequestAccessCodeApi:
          Type: HttpApi
          Properties:
            Path: /auth/request-code
            Method: POST
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/RequestAccessCode/RequestAccessCode.ts

  VerifyAccessCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: VerifyAccessCode.handler
      Tags:
        Name: !Sub '${AWS::StackName}-verify-access-code-function'
      Environment:
        Variables:
          ACCESS_CODES_TABLE: !Ref AccessCodesTableName
          MAX_CODE_ATTEMPTS: '5'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessCodesTableName
      Events:
        VerifyAccessCodeApi:
          Type: HttpApi
          Properties:
            Path: /auth/verify-code
            Method: POST
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/VerifyAccessCode/VerifyAccessCode.ts

  AccessCodeAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: AccessCodeAuthorizer.handler
      Tags:
        Name: !Sub '${AWS::StackName}-access-code-authorizer-function'
      Environment:
        Variables:
          ACCESS_CODES_TABLE: !Ref AccessCodesTableName
          MAX_CODE_ATTEMPTS: '5'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessCodesTableName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/AccessCodeAuthorizer/AccessCodeAuthorizer.ts

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
