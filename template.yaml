AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bedrock Model Evaluation Tool

Parameters:
  LogRetentionInDays:
    Type: Number
    Default: 14
  Owner:
    Type: String
  Project:
    Type: String
    Default: genai-inference-evaluation-tool

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    CodeUri: backend/
    Tags:
      Owner: !Ref Owner
      Project: !Ref Project
    Architectures:
      - arm64
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - '*'
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      AllowHeaders:
        - '*'

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Tags:
        Project: !Ref Project
        Owner: !Ref Owner
        Name: !Sub '${AWS::StackName}-api'

  # CloudWatch Log Groups
  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HealthFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  DatasetUploadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DatasetUploadFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationLaunchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationLaunchFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationStatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationStatusFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationResultsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvaluationResultsFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EvalFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  EvaluationEngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-evaluation-engine'
      RetentionInDays: !Ref LogRetentionInDays

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Tags:
        Name: !Sub '${AWS::StackName}-health-function'
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/Health/Health.ts

  DatasetUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Tags:
        Name: !Sub '${AWS::StackName}-dataset-upload-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DatasetBucket
      Events:
        UploadApi:
          Type: HttpApi
          Properties:
            Path: /datasets
            Method: POST
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/DatasetUpload/DatasetUpload.ts

  EvaluationLaunchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-launch-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTable
          ECS_CLUSTER: !Ref EvaluationCluster
          TASK_DEFINITION: !Ref EvaluationTaskDefinition
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EvaluationJobsTable
        - Statement:
            - Effect: Allow
              Action:
                - ecs:RunTask
              Resource: !Ref EvaluationTaskDefinition
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !GetAtt FargateExecutionRole.Arn
                - !GetAtt FargateTaskRole.Arn
      Events:
        LaunchApi:
          Type: HttpApi
          Properties:
            Path: /evaluations
            Method: POST
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationLaunch/EvaluationLaunch.ts

  EvaluationStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-status-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationJobsTable
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            Path: /evaluations/{id}
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationStatus/EvaluationStatus.ts

  EvaluationResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Tags:
        Name: !Sub '${AWS::StackName}-evaluation-results-function'
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref EvaluationJobsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationJobsTable
      Events:
        ResultsApi:
          Type: HttpApi
          Properties:
            Path: /evaluations/{id}/results
            Method: GET
            ApiId: !Ref Api
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/EvaluationResults/EvaluationResults.ts

  EvalFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 5120
      Tags:
        Name: !Sub '${AWS::StackName}-eval-function'
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend/python/
      DockerTag: latest

  # S3 Buckets
  DatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'bedrock-eval-datasets-${AWS::AccountId}-${AWS::Region}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Name
          Value: !Sub '${AWS::StackName}-dataset-bucket'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 3600

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Name
          Value: !Sub '${AWS::StackName}-frontend-bucket'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Effect: Deny
            Action: 's3:*'
            Principal: '*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # DynamoDB Table
  EvaluationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-evaluation-jobs'
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Name
          Value: !Sub '${AWS::StackName}-evaluation-jobs-table'
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: evaluation_id
          AttributeType: S
        - AttributeName: dataset_id
          AttributeType: S
      KeySchema:
        - AttributeName: evaluation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: dataset_id-index
          KeySchema:
            - AttributeName: dataset_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ECS Cluster
  EvaluationCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-evaluation-cluster'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Name
          Value: !Sub '${AWS::StackName}-evaluation-cluster'

  # IAM Roles
  FargateExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  FargateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluationEnginePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${DatasetBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt EvaluationJobsTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'

  # Fargate Task Definition
  EvaluationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-evaluation-engine'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '2048'
      Memory: '4096'
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt FargateExecutionRole.Arn
      TaskRoleArn: !GetAtt FargateTaskRole.Arn
      ContainerDefinitions:
        - Name: evaluation-engine
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AWS::StackName}-evaluation-engine:latest'
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EvaluationEngineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: evaluation-engine
          Environment:
            - Name: DATASET_BUCKET
              Value: !Ref DatasetBucket
            - Name: DYNAMODB_TABLE
              Value: !Ref EvaluationJobsTable
            - Name: EVALUATION_TIMEOUT_MINUTES
              Value: '30'

  # CloudFront
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
  DatasetBucketName:
    Description: S3 bucket for dataset storage
    Value: !Ref DatasetBucket
  EvaluationJobsTableName:
    Description: DynamoDB table for evaluation jobs
    Value: !Ref EvaluationJobsTable
  EvaluationClusterName:
    Description: ECS cluster for evaluation tasks
    Value: !Ref EvaluationCluster
  EvaluationTaskDefinitionArn:
    Description: Fargate task definition ARN
    Value: !Ref EvaluationTaskDefinition
