AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Preprocessing substack — orchestration state machine and its task Lambdas

Parameters:
  LogRetentionInDays:
    Type: Number
    Default: 14
  Owner:
    Type: String
  Project:
    Type: String
    Default: genai-inference-evaluation-tool
  DatasetBucketName:
    Type: String
  RootStackName:
    Type: String
    Description: >-
      Name of the root stack. Used for naming resources with length limits,
      since AWS::StackName inside a nested stack resolves to the long
      CloudFormation-generated name.
  PreprocessingStateMachineName:
    Type: String
    Default: preprocessing-sfn

Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: ../backend/
    Tags:
      Owner: !Ref Owner
      Project: !Ref Project
    Architectures:
      - x86_64

Resources:
  DocumentConversionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: DocumentConversion.handler
      Timeout: 300
      MemorySize: 1024
      Tags:
        Name: !Sub '${RootStackName}-document-conversion-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatasetBucketName
        - S3WritePolicy:
            BucketName: !Ref DatasetBucketName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        Banner:
          - "js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/DocumentConversion/DocumentConversion.ts

  GenerateSyntheticOutputRowFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: GenerateSyntheticOutputRow.handler
      Timeout: 30
      MemorySize: 512
      Tags:
        Name: !Sub '${RootStackName}-generate-synthetic-output-row-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
          SYNTHETIC_OUTPUT_MODEL_ID: us.meta.llama4-maverick-17b-instruct-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/GenerateSyntheticOutputRow/GenerateSyntheticOutputRow.ts

  FinalizeSyntheticDatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: FinalizeSyntheticDataset.handler
      Timeout: 60
      MemorySize: 1024
      Tags:
        Name: !Sub '${RootStackName}-finalize-synthetic-dataset-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${DatasetBucketName}/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/FinalizeSyntheticDataset/FinalizeSyntheticDataset.ts

  DocumentConversionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DocumentConversionFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  GenerateSyntheticOutputRowFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GenerateSyntheticOutputRowFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  FinalizeSyntheticDatasetFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FinalizeSyntheticDatasetFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  PreprocessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${RootStackName}-${PreprocessingStateMachineName}'
      Type: STANDARD
      Tags:
        Owner: !Ref Owner
        Project: !Ref Project
      DefinitionSubstitutions:
        DocumentConversionFunctionArn: !GetAtt DocumentConversionFunction.Arn
        GenerateSyntheticOutputRowFunctionArn: !GetAtt GenerateSyntheticOutputRowFunction.Arn
        FinalizeSyntheticDatasetFunctionArn: !GetAtt FinalizeSyntheticDatasetFunction.Arn
        DatasetBucketName: !Ref DatasetBucketName
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DocumentConversionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GenerateSyntheticOutputRowFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinalizeSyntheticDatasetFunction
        - S3ReadPolicy:
            BucketName: !Ref DatasetBucketName
        - S3WritePolicy:
            BucketName: !Ref DatasetBucketName
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${RootStackName}-${PreprocessingStateMachineName}'
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:StopExecution
              Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${RootStackName}-${PreprocessingStateMachineName}:*'
            - Effect: Allow
              Action:
                - events:PutTargets
                - events:PutRule
                - events:DescribeRule
              Resource:
                - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule'
      Definition:
        Comment: Document preprocessing pipeline (convert -> synthetic + structured)
        StartAt: DocumentConversion
        States:
          DocumentConversion:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${DocumentConversionFunctionArn}
              Payload.$: $
            ResultSelector:
              datasetId.$: $.Payload.datasetId
              taskType.$: $.Payload.taskType
              convertedDatasetArtifactKey.$: $.Payload.convertedDatasetArtifactKey
            ResultPath: $
            Next: SyntheticOutputsGeneration
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: PreprocessingFailed
          SyntheticOutputsGeneration:
            Type: Map
            ItemProcessor:
              ProcessorConfig:
                Mode: DISTRIBUTED
                ExecutionType: STANDARD
              StartAt: GenerateSyntheticOutputRow
              States:
                GenerateSyntheticOutputRow:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${GenerateSyntheticOutputRowFunctionArn}
                    Payload.$: $
                  OutputPath: $.Payload
                  Retry:
                    - ErrorEquals:
                        - TransientModelError
                      IntervalSeconds: 2
                      MaxAttempts: 5
                      BackoffRate: 2.0
                      MaxDelaySeconds: 30
                      JitterStrategy: FULL
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.TooManyRequestsException
                        - Lambda.SdkClientException
                      IntervalSeconds: 1
                      MaxAttempts: 3
                      BackoffRate: 2.0
                  Catch:
                    - ErrorEquals:
                        - TransientModelError
                      ResultPath: $.error
                      Next: RowFailedAfterRetries
                  End: true
                RowFailedAfterRetries:
                  Type: Pass
                  Parameters:
                    chunk_id.$: $.chunk_id
                    document_id.$: $.document_id
                    text.$: $.document
                    status: failed
                    error_message.$: "States.Format('Transient error persisted after retries: {}', $.error.Cause)"
                  End: true
            ItemReader:
              Resource: arn:aws:states:::s3:getObject
              ReaderConfig:
                InputType: JSONL
              Parameters:
                Bucket: ${DatasetBucketName}
                Key.$: $.convertedDatasetArtifactKey
            ItemSelector:
              chunk_id.$: $$.Map.Item.Value.chunk_id
              document_id.$: $$.Map.Item.Value.document_id
              document.$: $$.Map.Item.Value.document
              taskType.$: $.taskType
            ResultWriter:
              Resource: arn:aws:states:::s3:putObject
              Parameters:
                Bucket: ${DatasetBucketName}
                Prefix.$: "States.Format('preprocessing-results/{}', $.datasetId)"
              WriterConfig:
                Transformation: COMPACT
                OutputType: JSONL
            # Circuit breaker only, NOT a business-failure tolerance: with
            # partial success, per-document failures resolve as
            # normal completed iterations via the Catch blocks above and
            # never count here. This threshold only trips on genuine
            # iteration-level losses - a Lambda crash, OOM, or malformed input
            ToleratedFailureCount: 3
            ToleratedFailurePercentage: 5
            MaxConcurrency: 5
            ResultPath: $.mapResult
            Next: FinalizeSyntheticDataset
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: PreprocessingFailed
          FinalizeSyntheticDataset:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${FinalizeSyntheticDatasetFunctionArn}
              Payload:
                datasetId.$: $.datasetId
                manifestKey.$: $.mapResult.ResultWriterDetails.Key
            OutputPath: $.Payload
            End: true
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: PreprocessingFailed
          PreprocessingFailed:
            Type: Fail
            Error: PreprocessingFailed
            Cause: A preprocessing state failed

Outputs:
  PreprocessingStateMachineArn:
    Description: ARN of the preprocessing orchestration state machine
    Value: !Ref PreprocessingStateMachine
  PreprocessingStateMachineName:
    Description: Name of the preprocessing orchestration state machine
    Value: !GetAtt PreprocessingStateMachine.Name
