AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Preprocessing substack — orchestration state machine and its task Lambdas

Parameters:
  LogRetentionInDays:
    Type: Number
    Default: 14
  Owner:
    Type: String
  Project:
    Type: String
    Default: genai-inference-evaluation-tool
  DatasetBucketName:
    Type: String
  RootStackName:
    Type: String
    Description: >-
      Name of the root stack. Used for naming resources with length limits,
      since AWS::StackName inside a nested stack resolves to the long
      CloudFormation-generated name.

Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: ../backend/
    Tags:
      Owner: !Ref Owner
      Project: !Ref Project
    Architectures:
      - x86_64

Resources:
  DocumentConversionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: DocumentConversion.handler
      Timeout: 300
      MemorySize: 1024
      Tags:
        Name: !Sub '${AWS::StackName}-document-conversion-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DatasetBucketName
        - S3WritePolicy:
            BucketName: !Ref DatasetBucketName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        Banner:
          - "js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/DocumentConversion/DocumentConversion.ts

  RunSyntheticPreprocessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: RunSyntheticPreprocessing.handler
      Timeout: 900
      MemorySize: 1024
      Tags:
        Name: !Sub '${AWS::StackName}-run-synthetic-preprocessing-function'
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DatasetBucketName
          SYNTHETIC_OUTPUT_MODEL_ID: us.meta.llama4-maverick-17b-instruct-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${DatasetBucketName}/datasets/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        External:
          - '@aws-sdk'
        Minify: true
        Target: es2023
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handlers/RunSyntheticPreprocessing/RunSyntheticPreprocessing.ts

  DocumentConversionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DocumentConversionFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  RunSyntheticPreprocessingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RunSyntheticPreprocessingFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  PreprocessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${RootStackName}-preprocessing-sfn'
      Type: STANDARD
      Tags:
        Owner: !Ref Owner
        Project: !Ref Project
      DefinitionSubstitutions:
        DocumentConversionFunctionArn: !GetAtt DocumentConversionFunction.Arn
        RunSyntheticPreprocessingFunctionArn: !GetAtt RunSyntheticPreprocessingFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DocumentConversionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RunSyntheticPreprocessingFunction
      Definition:
        Comment: Document preprocessing pipeline (convert -> synthetic + structured)
        StartAt: DocumentConversion
        States:
          DocumentConversion:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${DocumentConversionFunctionArn}
              Payload.$: $
            ResultSelector:
              datasetId.$: $.Payload.datasetId
              taskType.$: $.Payload.taskType
              convertedDatasetArtifactKey.$: $.Payload.convertedDatasetArtifactKey
            ResultPath: $
            Next: RunSyntheticPreprocessing
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: PreprocessingFailed
          RunSyntheticPreprocessing:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${RunSyntheticPreprocessingFunctionArn}
              Payload:
                datasetId.$: $.datasetId
                taskType.$: $.taskType
                convertedDatasetArtifactKey.$: $.convertedDatasetArtifactKey
            OutputPath: $.Payload
            End: true
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: PreprocessingFailed
          PreprocessingFailed:
            Type: Fail
            Error: PreprocessingFailed
            Cause: A preprocessing state failed

Outputs:
  PreprocessingStateMachineArn:
    Description: ARN of the preprocessing orchestration state machine
    Value: !Ref PreprocessingStateMachine
  PreprocessingStateMachineName:
    Description: Name of the preprocessing orchestration state machine
    Value: !GetAtt PreprocessingStateMachine.Name
